<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This is the contact form, you can find our contact information and can reach out to us.">
    <meta name="author" content="Otsile Alex Ntshole">
    <title>River Rush Rafting | Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="River Rush Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1 class="contact-title"> River Rush Rafting</h1>

            <p>Address: 2056 East Idaho Springs Road, Idaho Springs, CO 80452</p>
            <p>Phone: (720) 919-1737</p>
            <p>Email: hello@riverrushrafting.com</p>
        </section>

        <div class="contact-layout">

            <section class="map-section">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3067.7481760398346!2d-105.4599655!3d39.7453072!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876ba325f8d942a9%3A0x1a70ff9189c45fb3!2s2056%20East%20Idaho%20Springs%20Road%2C%20Idaho%20Springs%2C%20CO%2080452%2C%20USA!5e0!3m2!1sen!2sbw!4v1790843330442!5m2!1sen!2sbw"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>

            <section class="contact-form">


                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <div class="message-purpose">
                        <p>Message <br> Purpose:</p>

                        <div class="purpose-options">
                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="general"
                                  required>
                                General Inquiry
                            </label>

                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>

                            <label for="suggestion">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5"></textarea>

                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>

            </section>
        </div>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <figure>
                <img src="images/employee.jpg" alt="Employee smiling">
                <figcaption>Amy Ntshole - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/operations.jpg" alt="Operations Manager">
                <figcaption>Emmah Smith - Operations Manager</figcaption>
            </figure>

            <figure>
                <img src="images/reservations.jpg" alt="Reservation Manager">
                <figcaption>Sarah Jones - Reservation Manager</figcaption>
            </figure>
        </section>


    </main>

    <footer>
        <p>&copy; 2026 River Rush Rafting | Otsile Alex Ntshole</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram icon">
            </a>
        </nav>
    </footer>

</body>

</html>
